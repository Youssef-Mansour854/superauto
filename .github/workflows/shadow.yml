name: Shadow worker

# Paper/shadow only. Never calls /api/scalp and never touches the main bot.
# SHADOW_URL defaults to the current Vercel deployment (override via secret if it changes).
# Optional secrets:
#   SHADOW_CRON_SECRET   -> sent as Authorization: Bearer when CRON_SECRET is set on Vercel
#   VERCEL_BYPASS_TOKEN  -> sent as x-vercel-protection-bypass when Deployment Protection is on
# Primary scheduler on Hobby: GitHub Actions every 5 minutes.
# Vercel Hobby cannot run */5 cron jobs. The production alias is public,
# so no VERCEL_BYPASS_TOKEN is needed; if you add one, it will be sent.

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shadow-worker
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call the isolated /api/shadow endpoint
        env:
          SHADOW_URL: ${{ secrets.SHADOW_URL || 'https://superauto5.vercel.app/api/shadow' }}
          SHADOW_CRON_SECRET: ${{ secrets.SHADOW_CRON_SECRET }}
          VERCEL_BYPASS_TOKEN: ${{ secrets.VERCEL_BYPASS_TOKEN }}
        run: |
          set -euo pipefail
          headers=()
          if [ -n "${SHADOW_CRON_SECRET:-}" ]; then
            headers+=(-H "Authorization: Bearer $SHADOW_CRON_SECRET")
          fi
          if [ -n "${VERCEL_BYPASS_TOKEN:-}" ]; then
            headers+=(-H "x-vercel-protection-bypass: $VERCEL_BYPASS_TOKEN")
          fi
          body_file=$(mktemp)
          code=$(curl --silent --show-error --max-time 150 \
            -o "$body_file" -w '%{http_code}' "${headers[@]}" "$SHADOW_URL")
          echo "http=$code"
          cat "$body_file"
          if [ "$code" != "200" ]; then
            echo "Shadow endpoint did not return 200. Check VERCEL_BYPASS_TOKEN / SHADOW_CRON_SECRET." >&2
            exit 1
          fi
          python3 -c 'import json,sys; json.load(open(sys.argv[1]))' "$body_file"
